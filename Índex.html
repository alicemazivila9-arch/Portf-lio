<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>New Dente – Clínica Dentária em Maputo</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --green: #1a7a4a;
      --green-mid: #22a060;
      --green-light: #2ecc7a;
      --green-pale: #e8f8f0;
      --green-pale2: #d0f0e2;
      --white: #ffffff;
      --off-white: #f7fdf9;
      --dark: #0d2318;
      --gray: #6b7c74;
      --gray-light: #f0f4f2;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: var(--white); color: var(--dark); overflow-x: hidden; }

    /* ── TOP BAR ── */
    .topbar {
      background: var(--green);
      color: #b8f0d4;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      padding: 8px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topbar a { color: #b8f0d4; text-decoration: none; }
    .topbar a:hover { color: #fff; }

    /* ── NAVBAR ── */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(34,160,96,0.12);
      padding: 0 60px;
      display: flex; align-items: center; justify-content: space-between;
      height: 72px;
      box-shadow: 0 2px 24px rgba(26,122,74,0.07);
      transition: box-shadow .3s;
    }
    .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo-mark {
      width: 44px; height: 44px;
      background: var(--green);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-mark svg { width: 26px; height: 26px; fill: white; }
    .logo-text { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; color: var(--green); line-height: 1; }
    .logo-sub { font-size: 0.7rem; color: var(--gray); letter-spacing: 0.12em; text-transform: uppercase; }
    .nav-links { display: flex; align-items: center; gap: 32px; list-style: none; }
    .nav-links a { text-decoration: none; color: var(--dark); font-size: 0.9rem; font-weight: 500; position: relative; transition: color .2s; }
    .nav-links a::after { content:''; position:absolute; bottom:-4px; left:0; width:0; height:2px; background:var(--green-mid); border-radius:2px; transition: width .25s; }
    .nav-links a:hover { color: var(--green); }
    .nav-links a:hover::after { width: 100%; }
    .nav-cta { background: var(--green); color: #fff !important; padding: 10px 22px; border-radius: 50px; font-weight: 600 !important; transition: background .2s, transform .15s !important; }
    .nav-cta::after { display: none !important; }
    .nav-cta:hover { background: var(--green-mid) !important; transform: translateY(-1px); }

    /* ── HERO ── */
    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 90vh;
      overflow: hidden;
    }
    .hero-left {
      padding: 80px 60px;
      background: linear-gradient(135deg, #e8f8f0 0%, #f5fcf8 100%);
      position: relative;
      display: flex; align-items: center;
    }
    .hero-dots {
      position: absolute; inset: 0;
      background-image: radial-gradient(circle, rgba(26,122,74,0.08) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
    }
    .hero-content { position: relative; z-index: 2; }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(26,122,74,0.1); border: 1px solid rgba(26,122,74,0.2);
      color: var(--green); font-size: 0.78rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 6px 16px; border-radius: 50px; margin-bottom: 28px;
      animation: fadeUp .6s ease both;
    }
    .hero-badge-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; display: inline-block; }
    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.6rem, 4vw, 3.8rem);
      font-weight: 900; line-height: 1.12; color: var(--dark);
      margin-bottom: 22px;
      animation: fadeUp .7s .1s ease both;
    }
    .hero h1 em { color: var(--green); font-style: normal; }
    .hero-desc {
      font-size: 1.05rem; color: var(--gray); line-height: 1.75;
      margin-bottom: 40px; font-weight: 300;
      animation: fadeUp .7s .2s ease both;
      max-width: 480px;
    }
    .hero-actions { display: flex; gap: 16px; flex-wrap: wrap; animation: fadeUp .7s .3s ease both; }
    .btn-primary {
      background: var(--green); color: #fff;
      padding: 15px 32px; border-radius: 50px;
      font-size: 0.95rem; font-weight: 600; text-decoration: none;
      display: inline-flex; align-items: center; gap: 10px;
      transition: background .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 8px 32px rgba(26,122,74,0.25);
    }
    .btn-primary svg { width: 18px; height: 18px; fill: white; flex-shrink: 0; }
    .btn-primary:hover { background: var(--green-mid); transform: translateY(-2px); box-shadow: 0 12px 40px rgba(26,122,74,0.35); }
    .btn-secondary {
      background: transparent; color: var(--green);
      padding: 15px 32px; border-radius: 50px;
      font-size: 0.95rem; font-weight: 600; text-decoration: none;
      border: 2px solid var(--green);
      transition: background .2s, color .2s, transform .15s;
    }
    .btn-secondary:hover { background: var(--green); color: #fff; transform: translateY(-2px); }
    .hero-stats { display: flex; gap: 28px; margin-top: 48px; animation: fadeUp .7s .45s ease both; flex-wrap: wrap; }
    .stat-num { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 700; color: var(--green); line-height: 1; }
    .stat-label { font-size: 0.75rem; color: var(--gray); letter-spacing: 0.05em; text-transform: uppercase; margin-top: 3px; font-weight: 500; }
    .stat-sep { width: 1px; background: rgba(26,122,74,0.2); align-self: stretch; }

    /* Hero right photo */
    .hero-right { position: relative; overflow: hidden; }
    .hero-right img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to right, rgba(232,248,240,0.25) 0%, transparent 35%); }
    .hero-img-badge {
      position: absolute; bottom: 40px; left: -24px;
      background: white; border-radius: 16px;
      padding: 16px 22px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.12);
      display: flex; align-items: center; gap: 12px;
      animation: slideInLeft .8s .6s ease both;
    }
    .hib-avatar { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; object-position: top; border: 3px solid var(--green-pale); }
    .hib-name { font-weight: 700; font-size: 0.88rem; color: var(--dark); }
    .hib-role { font-size: 0.72rem; color: var(--green); font-weight: 500; margin-top: 2px; }
    .hib-stars { color: #f5a623; font-size: 0.75rem; letter-spacing: 2px; margin-top: 3px; }

    /* ── SECTION BASE ── */
    section { padding: 100px 60px; }
    .section-tag { display: inline-block; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--green); margin-bottom: 12px; }
    .section-title { font-family: 'Playfair Display', serif; font-size: clamp(1.9rem, 3.2vw, 2.7rem); font-weight: 700; color: var(--dark); line-height: 1.2; margin-bottom: 16px; }
    .section-sub { font-size: 1.02rem; color: var(--gray); line-height: 1.7; max-width: 540px; font-weight: 300; }

    /* ── ABOUT ── */
    .about { background: var(--off-white); }
    .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 72px; align-items: center; }
    .about-photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .about-photo-grid img { width: 100%; border-radius: 16px; object-fit: cover; display: block; transition: transform .3s; }
    .about-photo-grid img:hover { transform: scale(1.02); }
    .about-photo-grid .tall { grid-row: span 2; height: 400px; }
    .about-photo-grid .short { height: 186px; }
    .about-features { display: flex; flex-direction: column; gap: 22px; margin-top: 32px; }
    .about-feature { display: flex; align-items: flex-start; gap: 16px; }
    .af-icon { width: 44px; height: 44px; background: var(--green-pale); border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .af-icon svg { width: 20px; height: 20px; fill: var(--green); }
    .af-title { font-weight: 600; font-size: 0.95rem; color: var(--dark); margin-bottom: 3px; }
    .af-text { font-size: 0.875rem; color: var(--gray); line-height: 1.6; }

    /* ── TEAM ── */
    .team { background: #fff; }
    .team-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin-top: 48px; }
    .team-card { border-radius: 20px; overflow: hidden; border: 1px solid rgba(26,122,74,0.08); transition: box-shadow .25s, transform .25s; }
    .team-card:hover { box-shadow: 0 16px 48px rgba(26,122,74,0.12); transform: translateY(-4px); }
    .team-card img { width: 100%; height: 280px; object-fit: cover; object-position: top; display: block; }
    .team-info { padding: 22px 24px; background: #fff; }
    .team-name { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; color: var(--dark); }
    .team-role { font-size: 0.8rem; color: var(--green); font-weight: 600; letter-spacing: 0.04em; margin-top: 4px; }

    /* ── INSURANCE ── */
    .insurance { background: var(--green-pale); padding: 64px 60px; }
    .insurance h3 { font-family: 'Playfair Display', serif; font-size: 1.3rem; text-align: center; color: var(--dark); margin-bottom: 32px; }
    .insurance-logos { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; align-items: center; }
    .ins-badge {
      background: white; border: 1.5px solid var(--green-pale2);
      border-radius: 12px; padding: 14px 28px;
      font-size: 0.88rem; font-weight: 700; color: var(--green);
      box-shadow: 0 2px 12px rgba(26,122,74,0.07);
      display: flex; align-items: center; gap: 10px;
    }
    .ins-badge svg { width: 18px; height: 18px; fill: var(--green); flex-shrink: 0; }
